# Chess.com Analytics Platform — central config.
# Override any value with an env var: CHESS_<UPPER_SNAKE_PATH>, e.g.
#   CHESS_INGESTION__ARCHIVE_MONTHS=3   ->  ingestion.archive_months
# Env overrides let the same code run locally, in Airflow, and in Cloud Run.

project:
  name: chess-analytics
  gcp_project_id: chess-analytics-dev      # placeholder; set real id via CHESS_PROJECT__GCP_PROJECT_ID
  bq_location: US                          # keep BQ datasets + GCS bucket co-located

api:
  base_url: https://api.chess.com/pub
  # Chess.com is Cloudflare-fronted and returns 403 without a descriptive
  # User-Agent. They ask for a contact address so they can reach you before
  # rate-limiting. This is the user's own email (identification only).
  user_agent: "chess-analytics-platform/0.1 (contact: adnan.anam2@cognizant.com)"
  timeout_sec: 30
  # Behind a corporate TLS-inspecting proxy (Zscaler, Netskope, ...) requests'
  # bundled CA won't trust the proxy's root. true => use the OS trust store,
  # which already has the corporate root installed. No effect on GCP/home nets.
  use_os_trust_store: true
  # Chess.com has no published rate limit but 429s on parallel bursts.
  # Serial requests with a small delay are the documented-safe pattern.
  min_interval_sec: 0.25
  max_retries: 5

storage:
  # backend: "local" writes to ./data ; "gcs" writes to the bucket below.
  backend: local
  local_root: ./data
  gcs_bucket: chess-lakehouse
  # Landing-zone layout (Hive-style partitioning, mirrored local & GCS):
  #   raw/games/year=YYYY/month=MM/player=<username>.json
  #   raw/players/profiles/<username>.json
  #   raw/players/stats/<username>.json
  #   raw/titled/<title>.json
  raw_prefix: raw

streaming:
  # Pub/Sub. The DLQ topic catches messages the subscription fails to deliver
  # (see docs: that is a different failure mode from a schema-invalid event,
  # which the Dataflow pipeline routes to its own side output).
  topic: chess-game-events
  dlq_topic: chess-game-events-dlq
  subscription: chess-game-events-dataflow
  # Moves for one game must arrive in order, so the publisher sets
  # ordering_key = game_id. Requires message ordering on the subscription too.
  enable_ordering: true

  # publisher backend: "pubsub" | "memory" (tests) | "stdout" (local demo)
  publisher: stdout

  simulator:
    # How many games are "in progress" at once. Real traffic is many concurrent
    # games, not one game at a time — this is what makes the windowed
    # aggregates non-trivial.
    concurrent_games: 5
    # Wall-clock seconds between consecutive moves of the SAME game, before the
    # speed multiplier. Randomised in this range to imitate think time.
    move_delay_min_sec: 0.5
    move_delay_max_sec: 3.0
    # >1 compresses time so a demo produces useful volume quickly.
    speed_multiplier: 1.0
    # 0 = unlimited; otherwise stop after this many games (keeps demos bounded).
    max_games: 20

  dataflow:
    # Events later than this past the watermark go to the late-events side
    # output instead of silently corrupting a closed window.
    allowed_lateness_sec: 120
    # Session gap for grouping a game's moves into one game-session window.
    session_gap_sec: 300
    # Fixed window for platform-wide throughput metrics (moves/min).
    metrics_window_sec: 60
    # Dedup horizon for event_id. Must exceed the expected redelivery window.
    dedup_window_sec: 600

ingestion:
  titled_categories: [GM, IM, FM, WGM, WIM]
  # How many top players to pull full game archives for (Sprint 1 target: 200).
  top_players: 200
  # Most recent N months of archives per player.
  archive_months: 6
